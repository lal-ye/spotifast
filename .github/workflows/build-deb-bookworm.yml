name: Build Debian package (bookworm)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  deb-bookworm:
    # Building inside a bookworm container keeps the produced binary linked
    # against glibc 2.36, so the .deb runs on Debian 12 (GitHub's own runners
    # have glibc 2.39, which Debian 12 cannot load).
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config cmake clang libclang-dev \
            libasound2-dev libpulse-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxext-dev libgl1-mesa-dev \
            desktop-file-utils hicolor-icon-theme

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=/github/home/.cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=/tmp/cargo-target" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Keeps the ~15 min Rust build off the critical path on reruns.
      - uses: Swatinem/rust-cache@v2

      - name: Build Spotifast
        run: cargo build --release --locked

      - name: Assemble .deb
        run: |
          set -eu
          version=$(awk '/^\[package\]/{f=1;next} f&&/^version *=/{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          case "$GITHUB_REF_NAME" in v[0-9]*) version=${GITHUB_REF_NAME#v} ;; esac
          pkgroot=/tmp/pkg
          mkdir -p "$pkgroot/DEBIAN" "$pkgroot/usr/bin" \
                   "$pkgroot/usr/share/applications" \
                   "$pkgroot/usr/share/icons/hicolor/scalable/apps"
          install -m755 "$CARGO_TARGET_DIR/release/spotifast" "$pkgroot/usr/bin/spotifast"
          install -m644 packaging/applications/spotifast.desktop \
            "$pkgroot/usr/share/applications/spotifast.desktop"
          install -m644 packaging/icons/spotifast.svg \
            "$pkgroot/usr/share/icons/hicolor/scalable/apps/spotifast.svg"
          cat > "$pkgroot/DEBIAN/control" <<EOF
          Package: spotifast
          Version: $version
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: spotifast-ci <ci@example.com>
          Depends: libc6 (>= 2.36), libasound2, libpulse0, libxkbcommon0, libwayland-client0
          Description: A fast native Spotify desktop client
           A native desktop client for Spotify, built from the upstream source
           against glibc 2.36 so it installs on Debian 12.
          EOF
          printf '%s\n' "/usr/bin/spotifast" > "$pkgroot/DEBIAN/postinst"
          printf '#!/bin/sh\nset -e\nif command -v update-desktop-database >/dev/null; then update-desktop-database -q /usr/share/applications || true; fi\nif command -v gtk-update-icon-cache >/dev/null; then gtk-update-icon-cache -q -f /usr/share/icons/hicolor || true; fi\nexit 0\n' > "$pkgroot/DEBIAN/postrm"
          chmod 755 "$pkgroot/DEBIAN/postinst" "$pkgroot/DEBIAN/postrm"
          out="spotifast_${version}_bookworm_amd64.deb"
          dpkg-deb --build --root-owner-group "$pkgroot" "$out"
          dpkg-deb --info "$out"
          echo "GLIBC symbols used (max):"
          objdump -T "$pkgroot/usr/bin/spotifast" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: spotifast-bookworm-deb
          path: '*.deb'